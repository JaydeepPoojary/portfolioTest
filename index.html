<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta content="IE=Edge" http-equiv="X-UA-Compatible">
    <meta name="description" content="Professional Flutter Developer Portfolio - Mobile & Web Development">
    <meta name="keywords" content="Flutter, Mobile Developer, Web Developer, Portfolio">
    <meta name="author" content="Jaydeep Poojary">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <meta name="apple-mobile-web-app-title" content="welcometomyflutterportfolio">
    <link rel="apple-touch-icon" href="icons/android-chrome-192x192.png">
    <link rel="icon" type="image/png" href="favicon.png"/>
    <title>Welcome to Jaydeep`s Portfolio</title>
    <link rel="manifest" href="manifest.json">

    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
          overflow: hidden;
          background: #0A0E27;
          cursor: none;
          font-family: 'Segoe UI', system-ui, sans-serif;
        }

        /* ── Screen ───────────────────────────────────────────────────────── */
        #loading-screen {
          position: fixed;
          inset: 0;
          background: linear-gradient(135deg, #0A0E27 0%, #151932 52%, #1E2341 100%);
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          z-index: 9999;
          transition: opacity 0.6s ease-out;
        }
        #loading-screen.fade-out {
          opacity: 0;
          pointer-events: none;
        }

        /* ── Dot-grid overlay ─────────────────────────────────────────────── */
        #loading-screen::before {
          content: '';
          position: absolute;
          inset: 0;
          background-image: radial-gradient(circle, rgba(108,92,231,.06) 1.2px, transparent 1.2px);
          background-size: 36px 36px;
          pointer-events: none;
        }

        /* ── Orbs ─────────────────────────────────────────────────────────── */
        .orb {
          position: absolute;
          border-radius: 50%;
          filter: blur(72px);
          pointer-events: none;
          animation: orbPulse 3s ease-in-out infinite;
        }
        .orb-1 { width:360px; height:360px; background:#6C5CE7; top:5%;   left:4%;  opacity:.13; animation-delay:0s;   }
        .orb-2 { width:280px; height:280px; background:#00D9FF; bottom:5%; right:3%; opacity:.13; animation-delay:1.4s; }
        .orb-3 { width:200px; height:200px; background:#FF6B6B; top:52%;  left:56%; opacity:.09; animation-delay:0.7s; }

        @keyframes orbPulse {
          0%,100% { transform:scale(1);   opacity:.14; }
          50%      { transform:scale(1.2); opacity:.24; }
        }

        /* ── Particles ────────────────────────────────────────────────────── */
        .particles { position:absolute; inset:0; overflow:hidden; pointer-events:none; }
        .particle  { position:absolute; border-radius:50%; animation:floatUp 6s ease-in-out infinite; }
        @keyframes floatUp {
          0%,100% { transform:translateY(0);    opacity:0;  }
          20%      {                             opacity:.5; }
          50%      { transform:translateY(-60px);            }
          80%      {                             opacity:.3; }
        }

        /* ── Centre content ───────────────────────────────────────────────── */
        .loader-container {
          position: relative;
          z-index: 2;
          display: flex;
          flex-direction: column;
          align-items: center;
          animation: fadeUp .9s ease-out both;
        }
        @keyframes fadeUp {
          from { opacity:0; transform:translateY(20px); }
          to   { opacity:1; transform:translateY(0);    }
        }

        /* ── Logo mark ────────────────────────────────────────────────────── */
        .logo-mark {
          width:80px; height:80px;
          border-radius:22px;
          background: linear-gradient(135deg, #6C5CE7, #00D9FF);
          display:flex; align-items:center; justify-content:center;
          box-shadow: 0 0 40px rgba(108,92,231,.45), 0 6px 24px rgba(0,217,255,.2);
          animation: logoPulse 2.8s ease-in-out infinite;
          margin-bottom: 44px;
        }
        .logo-mark svg { width:40px; height:40px; fill:#fff; }
        @keyframes logoPulse {
          0%,100% { box-shadow: 0 0 32px rgba(108,92,231,.40), 0 6px 20px rgba(0,217,255,.20); }
          50%      { box-shadow: 0 0 56px rgba(108,92,231,.70), 0 8px 32px rgba(0,217,255,.40); }
        }

        /* ── Bars visualiser ──────────────────────────────────────────────── */
        .bars {
          display:flex;
          align-items:flex-end;
          gap:7px;
          height:64px;
          margin-bottom:44px;
        }
        .bar {
          width:7px;
          border-radius:4px;
          animation: barWave 1.2s ease-in-out infinite alternate;
        }
        /* Staggered peak heights & delays: purple → cyan */
        .bar:nth-child(1)  { background:#6C5CE7; animation-delay:0.00s; --p:26px; }
        .bar:nth-child(2)  { background:#7B68EE; animation-delay:0.08s; --p:45px; }
        .bar:nth-child(3)  { background:#8A73F0; animation-delay:0.16s; --p:64px; }
        .bar:nth-child(4)  { background:#977CF2; animation-delay:0.24s; --p:38px; }
        .bar:nth-child(5)  { background:#A486F4; animation-delay:0.32s; --p:54px; }
        .bar:nth-child(6)  { background:#6EBBFF; animation-delay:0.40s; --p:32px; }
        .bar:nth-child(7)  { background:#38CAFF; animation-delay:0.48s; --p:58px; }
        .bar:nth-child(8)  { background:#18D5FF; animation-delay:0.56s; --p:42px; }
        .bar:nth-child(9)  { background:#00D9FF; animation-delay:0.64s; --p:48px; }
        .bar:nth-child(10) { background:#18D5FF; animation-delay:0.72s; --p:29px; }
        .bar:nth-child(11) { background:#38CAFF; animation-delay:0.80s; --p:51px; }
        .bar:nth-child(12) { background:#6EBBFF; animation-delay:0.88s; --p:35px; }
        @keyframes barWave {
          from { height:4px;      box-shadow:none; }
          to   { height:var(--p); box-shadow: 0 0 8px currentColor; }
        }

        /* ── Title ────────────────────────────────────────────────────────── */
        .loading-title {
          font-size:30px; font-weight:800; letter-spacing:5px;
          color:#fff;
          background: linear-gradient(90deg, #6C5CE7, #00D9FF, #fff, #00D9FF, #6C5CE7);
          background-size:300% auto;
          -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text;
          animation: shimmer 2s linear infinite;
          margin-bottom:10px; text-align:center;
        }
        .loading-subtitle {
          font-size:12px; font-weight:500; letter-spacing:3px;
          color:rgba(0,217,255,.7);
          margin-bottom:50px; text-align:center;
        }
        @keyframes shimmer {
          0%   { background-position:0%   center; }
          100% { background-position:300% center; }
        }

        /* ── Progress ─────────────────────────────────────────────────────── */
        .progress-wrapper { width:360px; max-width:88vw; }
        .progress-meta {
          display:flex; justify-content:space-between; align-items:center;
          margin-bottom:10px;
        }
        .progress-label { font-size:11px; letter-spacing:1.2px; color:#6E7191; }
        .progress-pct   {
          font-family:'Courier New', Courier, monospace;
          font-size:16px; font-weight:700; letter-spacing:2px; color:#00D9FF;
        }
        .progress-track {
          width:100%; height:6px;
          background:rgba(30,35,65,.9);
          border-radius:10px;
          border:1px solid rgba(108,92,231,.15);
          overflow:hidden; position:relative;
        }
        .progress-fill {
          height:100%; width:0%;
          border-radius:10px;
          background: linear-gradient(90deg, #6C5CE7, #00D9FF);
          box-shadow: 0 0 12px rgba(0,217,255,.6);
          transition: width .35s cubic-bezier(.4,0,.2,1);
          position:relative;
        }
        /* Glint on fill bar */
        .progress-fill::after {
          content:'';
          position:absolute; top:0; right:0;
          width:40px; height:100%;
          background:linear-gradient(90deg, transparent, rgba(255,255,255,.35), transparent);
          animation: glint 1.4s ease-in-out infinite;
        }
        @keyframes glint {
          0%   { transform:translateX(-40px); opacity:0; }
          50%  {                              opacity:1; }
          100% { transform:translateX(40px);  opacity:0; }
        }

        /* ── Status ───────────────────────────────────────────────────────── */
        .status-msg {
          margin-top:18px; font-size:13px; letter-spacing:1.2px;
          color:#6E7191; text-align:center; min-height:18px;
          transition:opacity .4s;
        }

        /* ── Responsive ───────────────────────────────────────────────────── */
        @media (max-width:500px) {
          .logo-mark { width:64px; height:64px; border-radius:17px; margin-bottom:32px; }
          .logo-mark svg { width:30px; height:30px; }
          .bars       { height:48px; gap:5px; margin-bottom:32px; }
          .bar        { width:5px; }
          .loading-title    { font-size:20px; letter-spacing:3px; }
          .loading-subtitle { font-size:10px; }
          .progress-wrapper { width:280px; }
          .progress-pct     { font-size:14px; }
        }
    </style>
</head>
<body>

<div id="loading-screen">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>
    <div class="particles" id="particles"></div>

    <div class="loader-container">

        <!-- Logo -->
        <div class="logo-mark">
            <svg viewBox="0 0 24 24">
                <path d="M8.7 15.9L4.8 12l3.9-3.9c.39-.39.39-1.01
          0-1.4-.39-.39-1.01-.39-1.4 0L2.71 11.29c-.39.39-.39
          1.02 0 1.41L7.3 17.3c.39.39 1.01.39 1.4 0 .39-.39.39-1.01
          0-1.4zm6.6 0l3.9-3.9-3.9-3.9c-.39-.39-.39-1.01
          0-1.4.39-.39 1.01-.39 1.4 0l4.59 4.59c.39.39.39
          1.02 0 1.41L16.7 17.3c-.39.39-1.01.39-1.4
          0-.39-.39-.39-1.01 0-1.4z"/>
            </svg>
        </div>

        <!-- Bars -->
        <div class="bars">
            <div class="bar"></div><div class="bar"></div><div class="bar"></div>
            <div class="bar"></div><div class="bar"></div><div class="bar"></div>
            <div class="bar"></div><div class="bar"></div><div class="bar"></div>
            <div class="bar"></div><div class="bar"></div><div class="bar"></div>
        </div>

        <!-- Title -->
        <div class="loading-title">LOADING PORTFOLIO</div>
        <div class="loading-subtitle">WELCOME TO MY PORTFOLIO</div>

        <!-- Progress -->
        <div class="progress-wrapper">
            <div class="progress-meta">
                <span class="progress-label">Loading...</span>
                <span class="progress-pct" id="pct">0%</span>
            </div>
            <div class="progress-track">
                <div class="progress-fill" id="progress-fill"></div>
            </div>
        </div>

        <div class="status-msg" id="status-msg">Initializing...</div>
    </div>
</div>

<script>
    /* ── Particles ──────────────────────────────────────────────────────────── */
    (function(){
      const c = document.getElementById('particles');
      const cols = ['#6C5CE7','#00D9FF','#8B7FF4'];
      for(let i=0;i<14;i++){
        const p = document.createElement('div');
        p.className = 'particle';
        const s = 2 + Math.random()*2.5;
        p.style.cssText = [
          `width:${s}px`,`height:${s}px`,
          `left:${Math.random()*100}%`,
          `top:${20+Math.random()*60}%`,
          `background:${cols[i%cols.length]}`,
          `animation-delay:${Math.random()*6}s`,
          `animation-duration:${4+Math.random()*4}s`,
        ].join(';');
        c.appendChild(p);
      }
    })();

    /* ── Progress ───────────────────────────────────────────────────────────── */
    const msgs = [
      [0,    'Initializing...'],
      [0.25, 'Loading assets...'],
      [0.55, 'Preparing UI...'],
      [0.85, 'Almost ready...'],
    ];
    const fillEl = document.getElementById('progress-fill');
    const pctEl  = document.getElementById('pct');
    const msgEl  = document.getElementById('status-msg');

    function setProgress(v){
      v = Math.min(v,1);
      const pct = Math.round(v*100);
      fillEl.style.width = pct+'%';
      pctEl.textContent  = pct+'%';
      const m = msgs.filter(x => v >= x[0]).pop();
      if(m) msgEl.textContent = m[1];
    }

    let sim = 0;
    const ticker = setInterval(()=>{
      sim += 0.012;
      setProgress(Math.min(sim, 0.92));
      if(sim >= 0.92) clearInterval(ticker);
    }, 60);

    /* ── Flutter ready ──────────────────────────────────────────────────────── */
    window.addEventListener('flutter-first-frame', function(){
      clearInterval(ticker);
      setProgress(1);
      setTimeout(function(){
        const el = document.getElementById('loading-screen');
        el.classList.add('fade-out');
        setTimeout(()=> el.style.display='none', 620);
      }, 300);
    });

    /* Fallback 8 s */
    setTimeout(function(){
      clearInterval(ticker);
      const el = document.getElementById('loading-screen');
      if(el && el.style.display !== 'none'){
        setProgress(1);
        setTimeout(()=>{
          el.classList.add('fade-out');
          setTimeout(()=> el.style.display='none', 620);
        }, 300);
      }
    }, 8000);
</script>

<script src="flutter_bootstrap.js" async></script>
</body>
</html>
