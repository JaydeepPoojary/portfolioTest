<html>
<head>

    <meta name="keywords" content="Flutter, Mobile Developer, Web Developer, Portfolio">
    <meta name="author" content="Your Name">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <meta name="apple-mobile-web-app-title" content="welcometomyflutterportfolio">
    <link rel="apple-touch-icon" href="icons/android-chrome-192x192.png">
    <link rel="icon" type="image/png" href="favicon.png"/>
    <title>Welcome to Jaydeep's Portfolio</title>
    <link rel="manifest" href="manifest.json">

    <!-- Google Fonts — Great Vibes (signature) + Orbitron (percentage/title) + JetBrains Mono (badges) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Orbitron:wght@700;900&family=JetBrains+Mono:wght@600;700&family=Inter:wght@300;400;600&family=Source+Code+Pro:wght@600&display=swap" rel="stylesheet">

    <!-- Firebase JS SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script>
        const firebaseConfig = {
          apiKey:            "YOUR_API_KEY",
          authDomain:        "YOUR_PROJECT_ID.firebaseapp.com",
          projectId:         "YOUR_PROJECT_ID",
          storageBucket:     "YOUR_PROJECT_ID.appspot.com",
          messagingSenderId: "YOUR_MESSAGING_SENDER_ID",
          appId:             "YOUR_APP_ID",
          measurementId:     "YOUR_MEASUREMENT_ID"
        };
        try {
          firebase.initializeApp(firebaseConfig);
          console.log("✅ Firebase JS SDK initialized successfully");
        } catch (e) {
          console.error("❌ Firebase JS SDK init failed:", e);
        }
    </script>

    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        /* ── Root colours — mirrors AppColors exactly ─────────────────────────── */
        :root {
          --bg:      #0A0A0F;
          --primary: #7C3AED;
          --accent:  #06B6D4;
          --pLight:  #9D50BB;
          --orange:  #F59E0B;
          --success: #10B981;
        }

        body { overflow: hidden; background: var(--bg); font-family: 'Inter', sans-serif; }

        /* ── Full-screen loading overlay ─────────────────────────────────────── */
        #loading-screen {
          position: fixed; inset: 0;
          background: var(--bg);
          display: flex; flex-direction: column;
          align-items: center; justify-content: center;
          z-index: 9999;
          transition: opacity .6s ease-out;
          overflow: hidden;
        }
        #loading-screen.fade-out { opacity: 0; pointer-events: none; }

        /* ── Background canvases ─────────────────────────────────────────────── */
        #matrix-canvas, #particle-canvas {
          position: absolute; inset: 0;
          pointer-events: none;
        }
        #matrix-canvas  { z-index: 0; }
        #particle-canvas { z-index: 1; }

        /* ── Corner brackets (mirroring Flutter TechCornerPainter) ──────────── */
        .corner {
          position: absolute;
          width: 72px; height: 72px;
          pointer-events: none;
          z-index: 10;
        }
        .corner::before, .corner::after {
          content: '';
          position: absolute;
          background: currentColor;
          border-radius: 2px;
        }
        /* Top-left */
        .corner-tl { top: 28px; left: 28px; color: var(--primary); opacity: .55;
          animation: cornerPulse 3s ease-in-out infinite; }
        .corner-tl::before { top:0; left:0; width:34px; height:2.5px; }
        .corner-tl::after  { top:0; left:0; width:2.5px; height:34px; }

        /* Bottom-right */
        .corner-br { bottom: 52px; right: 28px; color: var(--accent); opacity: .55;
          animation: cornerPulse 3s ease-in-out infinite .8s; }
        .corner-br::before { bottom:0; right:0; width:34px; height:2.5px; }
        .corner-br::after  { bottom:0; right:0; width:2.5px; height:34px; }

        @keyframes cornerPulse {
          0%,100% { opacity:.40; } 50% { opacity:.75; }
        }

        /* ── Main content ────────────────────────────────────────────────────── */
        .loader-content {
          position: relative; z-index: 5;
          display: flex; flex-direction: column;
          align-items: center;
          gap: 0;
          animation: fadeUp .7s ease-out both;
        }
        @keyframes fadeUp {
          from { opacity:0; transform:translateY(16px); }
          to   { opacity:1; transform:translateY(0); }
        }

        /* ═══════════════════════════════════════════════════════════════════════
           CUBE SECTION — energy rings + rotating cube + orbiting icons
           ═══════════════════════════════════════════════════════════════════════ */
        .cube-section {
          position: relative;
          width: 280px; height: 280px;
          display: flex; align-items: center; justify-content: center;
        }

        /* Energy rings */
        .ring {
          position: absolute; border-radius: 50%;
          border: 1.5px solid var(--primary);
          animation: ringRotate var(--dur, 6s) linear infinite;
        }
        .ring:nth-child(2) { animation-direction: reverse; border-color: var(--accent); }
        .ring:nth-child(3) { animation-direction: normal; border-color: var(--primary); }
        .ring:nth-child(4) { animation-direction: reverse; border-color: var(--accent); }
        .ring:nth-child(5) { animation-direction: normal;  border-color: var(--pLight); }

        @keyframes ringRotate { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

        /* Center glow — matches Flutter RadialGradient glow */
        .center-glow {
          position: absolute;
          border-radius: 50%;
          background: radial-gradient(circle,
            rgba(124,58,237,.35) 0%,
            rgba(6,182,212,.20)  40%,
            transparent          70%);
          animation: glowPulse 1.8s ease-in-out infinite alternate;
        }
        @keyframes glowPulse {
          from { transform: scale(.9); opacity: .7; }
          to   { transform: scale(1.1); opacity: 1; }
        }

        /* ── CSS 3D Cube ─────────────────────────────────────────────────────── */
        .cube-scene {
          position: relative; z-index: 3;
          perspective: 500px;
          width: 72px; height: 72px;
        }
        .cube {
          width: 72px; height: 72px;
          position: relative;
          transform-style: preserve-3d;
          animation: cubeRotate 4s linear infinite;
        }
        @keyframes cubeRotate {
          0%   { transform: rotateX(0deg)   rotateY(0deg)   rotateZ(0deg); }
          100% { transform: rotateX(360deg) rotateY(720deg) rotateZ(360deg); }
        }
        .face {
          position: absolute;
          width: 72px; height: 72px;
          border-radius: 14px;
          border: 2px solid rgba(255,255,255,.28);
          backface-visibility: hidden;
        }
        .face.front  { background: rgba(124,58,237,.85); transform: translateZ(36px);
          box-shadow: 0 0 24px rgba(124,58,237,.6); }
        .face.back   { background: rgba(6,182,212,.85);  transform: translateZ(-36px) rotateY(180deg);
          box-shadow: 0 0 24px rgba(6,182,212,.6); }
        .face.left   { background: rgba(157,80,187,.85); transform: translateX(-36px) rotateY(-90deg);
          box-shadow: 0 0 24px rgba(157,80,187,.6); }
        .face.right  { background: rgba(245,158,11,.85); transform: translateX(36px)  rotateY(90deg);
          box-shadow: 0 0 24px rgba(245,158,11,.6); }
        .face.top    { background: rgba(255,255,255,.80); transform: translateY(-36px) rotateX(90deg); }
        .face.bottom { background: rgba(124,58,237,.60); transform: translateY(36px)  rotateX(-90deg); }

        /* ── Orbiting platform icons ─────────────────────────────────────────── */
        .orbit-icon {
          position: absolute;
          width: 40px; height: 40px;
          border-radius: 50%;
          display: flex; align-items: center; justify-content: center;
          font-size: 18px; font-weight: 700;
          z-index: 4;
          transform-origin: center;
          pointer-events: none;
        }

        /* ═══════════════════════════════════════════════════════════════════════
           SIGNATURE — matches SmoothProfessionalSignature widget exactly
           ═══════════════════════════════════════════════════════════════════════ */
        .signature {
          font-family: 'Great Vibes', cursive;
          font-size: clamp(52px, 8vw, 82px);
          font-weight: 700;
          background: linear-gradient(135deg, var(--primary), var(--accent), var(--pLight), var(--primary));
          background-size: 300% auto;
          -webkit-background-clip: text; -webkit-text-fill-color: transparent;
          background-clip: text;
          text-shadow: none;
          animation: sigGradient 3s linear infinite;
          line-height: 1.1;
          filter: drop-shadow(0 0 30px rgba(124,58,237,.5))
                  drop-shadow(0 0 50px rgba(6,182,212,.3));
          margin-bottom: 16px;
        }
        @keyframes sigGradient {
          0%   { background-position: 0%   center; }
          100% { background-position: 300% center; }
        }

        /* ── FLUTTER DEVELOPER subtitle ─────────────────────────────────────── */
        .flutter-dev {
          font-family: 'Orbitron', monospace;
          font-size: clamp(10px, 1.3vw, 14px);
          font-weight: 700;
          letter-spacing: clamp(4px, .6vw, 6px);
          background: linear-gradient(90deg, rgba(255,255,255,.9), rgba(6,182,212,.9));
          -webkit-background-clip: text; -webkit-text-fill-color: transparent;
          background-clip: text;
          text-align: center;
          margin-bottom: 12px;
        }

        /* ── Tech badges — matches Flutter _badge() ─────────────────────────── */
        .badges {
          display: flex; flex-wrap: wrap;
          gap: 10px; justify-content: center;
          margin-bottom: 20px;
        }
        .badge {
          font-family: 'JetBrains Mono', monospace;
          font-size: 10px; font-weight: 700; letter-spacing: .5px;
          padding: 4px 10px;
          border-radius: 6px;
          border: 1.5px solid var(--bc);
          background: color-mix(in srgb, var(--bc) 15%, transparent);
          color: var(--bc);
          box-shadow: 0 0 8px color-mix(in srgb, var(--bc) 30%, transparent);
        }

        /* ═══════════════════════════════════════════════════════════════════════
           PROGRESS SECTION — mirrors Flutter progress bar exactly
           ═══════════════════════════════════════════════════════════════════════ */
        .progress-section {
          display: flex; flex-direction: column; align-items: center;
          gap: 0; width: 100%;
        }

        /* Holographic percentage — Orbitron with gradient */
        .pct-display {
          font-family: 'Orbitron', monospace;
          font-size: clamp(24px, 3.5vw, 32px);
          font-weight: 900;
          letter-spacing: clamp(2px, .4vw, 4px);
          background: linear-gradient(135deg, var(--primary), var(--accent), var(--pLight));
          background-size: 200% auto;
          -webkit-background-clip: text; -webkit-text-fill-color: transparent;
          background-clip: text;
          animation: pctGrad 2s linear infinite alternate;
          margin-bottom: 14px;
        }
        @keyframes pctGrad {
          from { background-position: 0%   center; }
          to   { background-position: 200% center; }
        }

        /* Progress bar track + fill */
        .progress-bar {
          position: relative;
          width: clamp(240px, 55vw, 360px);
          height: 12px;
          margin-bottom: 10px;
        }
        .pb-track {
          position: absolute; inset: 0;
          border-radius: 8px;
          background: rgba(255,255,255,.03);
          border: 1.5px solid rgba(124,58,237,.3);
          /* Grid pattern overlay */
          background-image: repeating-linear-gradient(
            90deg, rgba(124,58,237,.08) 0px, rgba(124,58,237,.08) 1px,
            transparent 1px, transparent 8px);
        }
        .pb-fill {
          position: absolute; top:0; left:0; bottom:0;
          width: 0%;
          border-radius: 8px;
          background: linear-gradient(90deg, var(--primary), var(--accent), var(--pLight));
          box-shadow: 0 0 30px 4px rgba(124,58,237,.9);
          transition: width .3s cubic-bezier(.4,0,.2,1);
          overflow: hidden;
        }
        /* Shimmer on fill */
        .pb-fill::after {
          content:'';
          position:absolute; top:0; right:0;
          width:80px; height:100%;
          background: linear-gradient(90deg, transparent, rgba(255,255,255,.6), transparent);
          animation: pbShimmer 1.4s ease-in-out infinite;
        }
        @keyframes pbShimmer {
          0%   { transform:translateX(-80px); opacity:0; }
          50%  { opacity:1; }
          100% { transform:translateX(80px);  opacity:0; }
        }
        /* Glow point at leading edge */
        .pb-glow {
          position: absolute;
          top: 50%; transform: translateY(-50%);
          width: 24px; height: 24px;
          border-radius: 50%;
          background: radial-gradient(circle, #fff 0%, var(--accent) 60%);
          box-shadow: 0 0 25px 8px rgba(255,255,255,.85);
          margin-left: -12px;
          transition: left .3s cubic-bezier(.4,0,.2,1);
          pointer-events: none;
        }

        /* Loading stage text */
        .stage-text {
          font-family: 'Source Code Pro', monospace;
          font-size: clamp(10px, 1.2vw, 11px);
          font-weight: 600;
          letter-spacing: 1.5px;
          color: rgba(6,182,212,.8);
          text-align: center;
        }

        /* ── Status bar — matches Flutter _buildStatusBar() ─────────────────── */
        .status-bar {
          position: absolute; bottom: 0; left: 0; right: 0;
          height: 34px;
          display: flex; align-items: center;
          justify-content: space-between;
          padding: 0 20px;
          z-index: 10;
        }
        .status-left {
          display: flex; align-items: center; gap: 8px;
          font-family: 'Source Code Pro', monospace;
          font-size: 10px; font-weight: 700; letter-spacing: .8px;
          color: var(--success);
        }
        .status-dot {
          width: 8px; height: 8px; border-radius: 50%;
          background: var(--success);
          box-shadow: 0 0 8px 2px var(--success);
          animation: dotPulse 1.5s ease-in-out infinite alternate;
        }
        @keyframes dotPulse {
          from { opacity:.6; box-shadow:0 0 6px 1px var(--success); }
          to   { opacity:1;  box-shadow:0 0 12px 3px var(--success); }
        }
        .status-right {
          font-family: 'Source Code Pro', monospace;
          font-size: 10px; letter-spacing: .5px;
          color: rgba(255,255,255,.45);
        }

        /* ── Responsive tweaks ───────────────────────────────────────────────── */
        @media (max-width: 600px) {
          .cube-section    { width:200px; height:200px; }
          .corner          { width:52px;  height:52px; }
          .corner-tl       { top:18px;    left:18px; }
          .corner-br       { bottom:42px; right:18px; }
          #matrix-canvas   { display:none; }  /* lighter on mobile */
        }
        @media (min-width: 1920px) {
          .cube-section    { width:340px; height:340px; }
          .signature       { font-size:105px; }
          .flutter-dev     { font-size:18px; letter-spacing:8px; }
          .pct-display     { font-size:40px; }
          .progress-bar    { width:440px; height:14px; }
          .pb-glow         { width:28px; height:28px; margin-left:-14px; }
        }

<body>

<div id="loading-screen">

    <!-- Background effects -->
    <canvas id="matrix-canvas"></canvas>
    <canvas id="particle-canvas"></canvas>

    <!-- Corner brackets (same as Flutter TechCornerPainter) -->
    <div class="corner corner-tl"></div>
    <div class="corner corner-br"></div>

    <!-- ── Main content ──────────────────────────────────────────────────── -->
    <div class="loader-content">

        <!-- Cube section -->
        <div class="cube-section" id="cubeSection">
            <!-- Energy rings — sizes set by JS to match Flutter ring values -->
            <div class="ring" id="ring1"></div>

</div><!-- /loading-screen -->

<script>
    // ═══════════════════════════════════════════════════════════════════════════
    // 1.  RESPONSIVE RING SIZES — mirrors Flutter _buildCubeSection() exactly
    // ═══════════════════════════════════════════════════════════════════════════
    (function () {
      const sw = window.innerWidth;
      const isMobile    = sw < 600;
      const isTablet    = sw >= 600  && sw < 900;
      const isUltraWide = sw >= 1920;

      // Flutter values per layout:
      //   mobile:    ringBase=60, ringStep=22, ringCount=3, cubeSize=200
      //   tablet:    ringBase=80, ringStep=28, ringCount=4, cubeSize=270
      //   desktop:   ringBase=120,ringStep=35, ringCount=5, cubeSize=350
      //   ultraWide: ringBase=145,ringStep=42, ringCount=5, cubeSize=420
      let ringBase, ringStep, ringCount, cubeSize, orbitR, iconSize, glowSize;
      if (isMobile) {
        ringBase=60; ringStep=22; ringCount=3; cubeSize=200; orbitR=70;  iconSize=34; glowSize=100;
      } else if (isTablet) {
        ringBase=80; ringStep=28; ringCount=4; cubeSize=270; orbitR=98;  iconSize=42; glowSize=135;
      } else if (isUltraWide) {
        ringBase=145;ringStep=42; ringCount=5; cubeSize=420; orbitR=158; iconSize=60; glowSize=215;
      } else {
        ringBase=120;ringStep=35; ringCount=5; cubeSize=350; orbitR=130; iconSize=50; glowSize=180;
      }

      // Apply section size
      const sec = document.getElementById('cubeSection');
      sec.style.width  = cubeSize + 'px';
      sec.style.height = cubeSize + 'px';

      // Apply glow size
      const glow = document.getElementById('centerGlow');
      glow.style.width  = glowSize + 'px';
      glow.style.height = glowSize + 'px';

      // Apply rings
      const durations = [6,5,7,4.5,8]; // different rotation speeds
      for (let i = 1; i <= 5; i++) {
        const el = document.getElementById('ring' + i);
        if (!el) continue;
        if (i > ringCount) { el.style.display = 'none'; continue; }
        const sz = ringBase + (i - 1) * ringStep;
        el.style.width    = sz + 'px';
        el.style.height   = sz + 'px';
        el.style.setProperty('--dur', durations[i-1] + 's');
        el.style.opacity  = (0.5 - (i-1)*0.08).toFixed(2);
      }

      // ── Orbiting platform icons (JS animated, matches Flutter) ─────────────
      const orbitDefs = [
        { label:'F',  color:'#02569B', bg:'rgba(2,86,155,.18)',   title:'Flutter'  },
        { label:'🤖', color:'#3DDC84', bg:'rgba(61,220,132,.18)', title:'Android'  },
        { label:'',  color:'#eeeeee', bg:'rgba(238,238,238,.18)',title:'iOS'      },
        { label:'🌐', color:'#06B6D4', bg:'rgba(6,182,212,.18)',  title:'Web'      },
        { label:'💻', color:'#9D50BB', bg:'rgba(157,80,187,.18)', title:'Desktop'  },
      ];

      const container = document.getElementById('orbitIcons');
      const icons = [];
      const cx = cubeSize / 2;
      const cy = cubeSize / 2;

      orbitDefs.forEach((def, i) => {
        const el = document.createElement('div');
        el.className = 'orbit-icon';
        el.style.cssText = [
          `width:${iconSize}px`, `height:${iconSize}px`,
          `position:absolute`,
          `background:${def.bg}`,
          `border:2px solid color-mix(in srgb, ${def.color} 60%, transparent)`,
          `box-shadow:0 0 16px color-mix(in srgb,${def.color} 55%,transparent)`,
          `font-size:${iconSize*0.44}px`,
          `color:${def.color}`,
        ].join(';');
        el.textContent = def.label;
        el.title = def.title;
        container.appendChild(el);
        icons.push({ el, baseAngle: (i * 72) * Math.PI / 180 });
      });

      // Animate orbits
      let orbitT = 0;
      (function orbit() {
        orbitT += 0.008;
        icons.forEach(({ el, baseAngle }) => {
          const angle = baseAngle + orbitT;
          const wobble = Math.sin(orbitT * 3 + baseAngle) * 10;
          const r = orbitR + wobble;
          const x = cx + Math.cos(angle) * r - iconSize / 2;
          const y = cy + Math.sin(angle) * r - iconSize / 2;
          const scale = 1 + Math.sin(orbitT * 4 + baseAngle) * 0.12;
          el.style.left      = x + 'px';
          el.style.top       = y + 'px';
          el.style.transform = `scale(${scale})`;
        });
        requestAnimationFrame(orbit);
      })();
    })();

    // ═══════════════════════════════════════════════════════════════════════════
    // 3.  FLOATING PARTICLES (matches Flutter TechParticlesPainter)
    // ═══════════════════════════════════════════════════════════════════════════
    (function () {
      const canvas = document.getElementById('particle-canvas');
      const ctx    = canvas.getContext('2d');
      canvas.width  = window.innerWidth;
      canvas.height = window.innerHeight;

      const sw      = window.innerWidth;
      const count   = sw < 600 ? 35 : sw < 900 ? 55 : 80;
      const rng     = (seed) => { let x=Math.sin(seed+1)*1e4; return x-Math.floor(x); };

      const pts = Array.from({length: count}, (_, i) => ({
        x:      rng(i*7)  * canvas.width,
        y:      rng(i*11) * canvas.height,
        r:      1.5 + rng(i*3) * 3.5,
        speed:  0.3 + rng(i*5) * 0.7,
        phase:  rng(i*13) * Math.PI * 2,
      }));

      let t = 0;
      (function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        pts.forEach(p => {
          const offset = (t * p.speed + p.phase) % (Math.PI * 2);
          const y      = p.y + Math.sin(offset) * 35;
          const opc    = Math.max(.12, Math.abs(Math.sin(offset)) * .6);

          // White core
          ctx.beginPath();
          ctx.arc(p.x, y, p.r, 0, Math.PI*2);
          ctx.fillStyle = `rgba(255,255,255,${opc})`;
          ctx.fill();

          // Purple glow
          ctx.beginPath();
          ctx.arc(p.x, y, p.r * 5, 0, Math.PI*2);
          const grad = ctx.createRadialGradient(p.x,y,0, p.x,y, p.r*5);
          grad.addColorStop(0, `rgba(124,58,237,${opc*.4})`);
          grad.addColorStop(1, 'transparent');
          ctx.fillStyle = grad;
          ctx.fill();
        });
        t += 0.012;
        requestAnimationFrame(draw);
      })();
    })();

    // ═══════════════════════════════════════════════════════════════════════════
    // 4.  PROGRESS SIMULATION (same logic as original — unchanged)
    // ═══════════════════════════════════════════════════════════════════════════
    const stages = [
      [0.00, '⚡ LOADING ASSETS...'],
      [0.25, '🔧 INITIALIZING COMPONENTS...'],
      [0.50, '🎨 RENDERING UI...'],
      [0.75, '✨ FINALIZING...'],
    ];
    const pbFill  = document.getElementById('pbFill');
    const pbGlow  = document.getElementById('pbGlow');
    const pctEl   = document.getElementById('pct');
    const stageEl = document.getElementById('stageText');

    function setProgress(v) {
      v = Math.min(v, 1);
      const pct = Math.round(v * 100);
      pbFill.style.width = pct + '%';
      pbGlow.style.left  = pct + '%';
      pctEl.textContent  = pct + '%';
      const s = stages.filter(x => v >= x[0]).pop();
      if (s) stageEl.textContent = s[1];
    }

    let sim = 0;
    const ticker = setInterval(() => {
      sim += 0.012;
      setProgress(Math.min(sim, 0.92));
      if (sim >= 0.92) clearInterval(ticker);
    }, 60);

    // Flutter ready — same as original
    window.addEventListener('flutter-first-frame', function () {
      clearInterval(ticker);
      setProgress(1);
      setTimeout(function () {
        const el = document.getElementById('loading-screen');
        el.classList.add('fade-out');
        setTimeout(() => el.style.display = 'none', 620);
      }, 350);
    });

    // Fallback 8s — same as original
    setTimeout(function () {
      clearInterval(ticker);
      const el = document.getElementById('loading-screen');
      if (el && el.style.display !== 'none') {
        setProgress(1);
        setTimeout(() => {
          el.classList.add('fade-out');
          setTimeout(() => el.style.display = 'none', 620);
        }, 300);
      }
    }, 8000);
</script>
